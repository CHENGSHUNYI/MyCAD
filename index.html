<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打地鼠遊戲 - Whack-A-Mole</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74b9ff, #dfe6e9);
            text-align: center;
            margin: 0;
            padding: 20px;
            user-select: none;
        }

        h1 {
            color: #2d3436;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .scoreboard {
            font-size: 20px;
            color: #2d3436;
            background: #ffffff;
            display: inline-block;
            padding: 10px 25px;
            border-radius: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            font-weight: bold;
        }

        .scoreboard span {
            color: #e17055;
            margin: 0 10px;
        }

        .game-board {
            width: 360px;
            height: 360px;
            background-color: #2d3436;
            margin: 0 auto;
            border-radius: 20px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 15px;
            padding: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .hole {
            background-color: #636e72;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 8px 0 rgba(0,0,0,0.3);
        }

        .mole {
            width: 100%;
            height: 100%;
            background-color: #d63031;
            border-radius: 50%;
            position: absolute;
            top: 100%;
            left: 0;
            transition: top 0.1s ease-in-out;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 -5px 0 #b71540 inset;
        }

        .hole.up .mole {
            top: 0;
        }

        .mole.hit {
            background-color: #fdcb6e;
            box-shadow: 0 -5px 0 #e17055 inset;
        }

        .btn-start {
            margin-top: 25px;
            font-size: 18px;
            font-weight: bold;
            padding: 12px 30px;
            background-color: #00b894;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s, transform 0.1s;
        }

        .btn-start:hover {
            background-color: #00cec9;
        }

        .btn-start:active {
            transform: scale(0.95);
        }

        .btn-start:disabled {
            background-color: #b2bec3;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <h1>🔨 打地鼠遊戲 🔨</h1>
    
    <div class="scoreboard">
        得分: <span id="score">0</span> | 剩餘時間: <span id="time">30</span>s
    </div>

    <div class="game-board" id="board">
        <!-- 9 個洞與地鼠 -->
        <div class="hole"><div class="mole">🐹</div></div>
        <div class="hole"><div class="mole">🐹</div></div>
        <div class="hole"><div class="mole">🐹</div></div>
        <div class="hole"><div class="mole">🐹</div></div>
        <div class="hole"><div class="mole">🐹</div></div>
        <div class="hole"><div class="mole">🐹</div></div>
        <div class="hole"><div class="mole">🐹</div></div>
        <div class="hole"><div class="mole">🐹</div></div>
        <div class="hole"><div class="mole">🐹</div></div>
    </div>

    <div>
        <button class="btn-start" id="startBtn" onclick="startGame()">開始遊戲</button>
    </div>

    <script>
        const holes = document.querySelectorAll('.hole');
        const scoreBoard = document.getElementById('score');
        const timeBoard = document.getElementById('time');
        const startBtn = document.getElementById('startBtn');
        
        let lastHole;
        let timeUp = false;
        let score = 0;
        let countdown;
        let peepInterval;

        function randomTime(min, max) {
            return Math.round(Math.random() * (max - min) + min);
        }

        function randomHole(holes) {
            const idx = Math.floor(Math.random() * holes.length);
            const hole = holes[idx];
            if (hole === lastHole) {
                return randomHole(holes);
            }
            lastHole = hole;
            return hole;
        }

        function peep() {
            if (timeUp) return;
            const time = randomTime(400, 1000); // 地鼠停留時間 (毫秒)
            const hole = randomHole(holes);
            const mole = hole.querySelector('.mole');
            
            hole.classList.add('up');
            
            setTimeout(() => {
                hole.classList.remove('up');
                mole.classList.remove('hit');
                if (!timeUp) peep();
            }, time);
        }

        function startGame() {
            scoreBoard.textContent = 0;
            timeBoard.textContent = 30;
            startBtn.disabled = true;
            score = 0;
            timeUp = false;
            let timeLeft = 30;

            peep();

            countdown = setInterval(() => {
                timeLeft--;
                timeBoard.textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timeUp = true;
                    startBtn.disabled = false;
                    setTimeout(() => {
                        alert(`時間到！你的最終得分是：${score} 分！`);
                    }, 200);
                }
            }, 1000);
        }

        function whack(e) {
            if (!e.isTrusted) return; // 防止腳本模擬點擊
            if (!this.classList.contains('hit')) {
                this.classList.add('hit');
                score++;
                scoreBoard.textContent = score;
            }
        }

        const moles = document.querySelectorAll('.mole');
        moles.forEach(mole => mole.addEventListener('click', whack));
    </script>

</body>
</html>
